<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chili Arcade</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">
      🌶️ Chili Arcade
    </div>

    <nav>
      <a href="https://github.com/innesaldous/chili-bowl-games" target="_blank">
        Chili Bowl Games
      </a>

      <button id="randomButton">
        Random Game
      </button>
    </nav>
  </header>

  <main>

    <section class="hero">
      <h1>Chili Arcade</h1>

      <p>
        Browser games that run directly from the web.
      </p>

      <div class="search-area">
        <input
          type="text"
          id="search"
          placeholder="Search games..."
        >
      </div>
    </section>

    <section class="filters">
      <button class="filter active" data-category="all">
        All
      </button>

      <button class="filter" data-category="arcade">
        Arcade
      </button>

      <button class="filter" data-category="puzzle">
        Puzzle
      </button>

      <button class="filter" data-category="simulation">
        Simulation
      </button>

      <button class="filter" data-category="creative">
        Creative
      </button>
    </section>

    <section id="gameGrid" class="game-grid"></section>

  </main>

  <div id="gameModal" class="modal">

    <div class="modal-content">

      <div class="modal-header">
        <h2 id="gameTitle">Game</h2>

        <button id="closeButton">
          ✕
        </button>
      </div>

      <iframe
        id="gameFrame"
        src=""
        allowfullscreen>
      </iframe>

      <div class="modal-footer">
        <a
          id="openGame"
          href="#"
          target="_blank">
          Open Game in New Tab
        </a>
      </div>

    </div>

  </div>

  <footer>
    <p>
      Chili Arcade • Browser Game Portal
    </p>

    <p>
      Games are hosted by their respective projects.
    </p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
